name: Deploy

# Deploys the Worker to Cloudflare so you never have to run it from your own
# machine. Two ways to trigger:
#   1. Manually from the Actions tab ("Run workflow"), optionally re-registering
#      the Discord slash commands in the same run.
#   2. Automatically on every push to `main`.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    — API token using the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID   — from the Workers overview page sidebar
# Required only when "Re-register slash commands" is checked:
#   DISCORD_APPLICATION_ID  — Discord dev portal → General Information
#   DISCORD_BOT_TOKEN       — Discord dev portal → Bot (reset to obtain)
#
# The Worker's RUNTIME secrets (DISCORD_BOT_TOKEN, DISCORD_PUBLIC_KEY,
# DISCORD_APPLICATION_ID) are set once with `wrangler secret put` and persist on
# the Worker across deploys — they are NOT needed as Actions secrets for deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      register:
        description: Re-register Discord slash commands (global)
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test before deploying
        run: npx tsc --noEmit && npm test

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Re-register Discord slash commands
        if: inputs.register
        run: npm run register
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
