name = "altair-cleanup"
main = "src/index.ts"
compatibility_date = "2024-06-01"

# Automatic cleanup: run every 15 minutes.
# Adjust or add more cron expressions as needed.
[triggers]
crons = ["*/15 * * * *"]

# ---------------------------------------------------------------------------
# Non-secret configuration. Secrets (DISCORD_BOT_TOKEN, DISCORD_PUBLIC_KEY)
# are set with `wrangler secret put <NAME>` and are NOT stored here.
# ---------------------------------------------------------------------------
[vars]
# Discord app identity. These are PUBLIC by design (the public key only verifies
# that interaction requests come from Discord; it grants no access), so they
# live here rather than as secrets. The Bot Token is the only real secret and is
# set via `wrangler secret put DISCORD_BOT_TOKEN`.
DISCORD_APPLICATION_ID = "1530452805733716058"
DISCORD_PUBLIC_KEY = "49d2cd546d1ee9efd1a55f79cd50e5779f4961f3ce7042eec55591e71acd84c8"

# Altair's Discord bot user ID (used in servers where it posts as the bot user).
ALTAIR_USER_ID = "522879744786563075"

# Altair sends notifications via a per-server WEBHOOK named "Altair" (its author
# id differs per server, so we match on this exact name instead). Exact,
# case-insensitive match — must catch "Altair" but NOT this bot's own
# "Altair Cleanup" replies.
ALTAIR_WEBHOOK_NAME = "Altair"

# OPTIONAL static extra channels, merged with whatever /watch add stores in KV.
# Normally leave this empty and manage channels at runtime via /watch.
CLEANUP_CHANNEL_IDS = ""

# How many recent messages to fetch per channel per run (max 100).
SCAN_LIMIT = "100"

# Staleness rule: an Altair message is deleted once it contains any Discord
# timestamp at least this many seconds in the past (120 = 2 minutes).
STALE_GRACE_SECONDS = "120"

# Temporary: when "1", /cleanup dumps the first Altair message's raw embeds for
# debugging. Remove once expiry parsing is confirmed.
DEBUG = "1"

# Safety switch. While "true", the bot logs what it WOULD delete but does not
# actually delete anything. Set to "false" once you've verified the logs.
DRY_RUN = "true"

# ---------------------------------------------------------------------------
# KV namespace for the /watch channel list. Create it once with:
#   npx wrangler kv namespace create WATCH_KV
# then paste the printed id below (replace REPLACE_WITH_KV_ID).
# For local `wrangler dev`, also run: npx wrangler kv namespace create WATCH_KV --preview
# and add `preview_id = "..."` to this block.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "WATCH_KV"
id = "4364e9205515442a99df6706be00cc6e"
