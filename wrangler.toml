name = "altair-cleanup"
main = "src/index.ts"
compatibility_date = "2024-06-01"

# Automatic cleanup: run every 15 minutes.
# Adjust or add more cron expressions as needed.
[triggers]
crons = ["*/15 * * * *"]

# ---------------------------------------------------------------------------
# Non-secret configuration. Secrets (DISCORD_BOT_TOKEN, DISCORD_PUBLIC_KEY)
# are set with `wrangler secret put <NAME>` and are NOT stored here.
# ---------------------------------------------------------------------------
[vars]
# Altair's Discord application/user ID. Only messages from this author are
# ever considered for deletion.
ALTAIR_USER_ID = "522879744786563075"

# OPTIONAL static extra channels, merged with whatever /watch add stores in KV.
# Normally leave this empty and manage channels at runtime via /watch.
CLEANUP_CHANNEL_IDS = ""

# How many recent messages to fetch per channel per run (max 100).
SCAN_LIMIT = "100"

# Safety switch. While "true", the bot logs what it WOULD delete but does not
# actually delete anything. Set to "false" once you've verified the logs.
DRY_RUN = "true"

# ---------------------------------------------------------------------------
# KV namespace for the /watch channel list. Create it once with:
#   npx wrangler kv namespace create WATCH_KV
# then paste the printed id below (replace REPLACE_WITH_KV_ID).
# For local `wrangler dev`, also run: npx wrangler kv namespace create WATCH_KV --preview
# and add `preview_id = "..."` to this block.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "WATCH_KV"
id = "REPLACE_WITH_KV_ID"
